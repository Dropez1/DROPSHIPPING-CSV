<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Taxonomy eBay</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f0f; color: #e8e8e8; font-family: 'Segoe UI', sans-serif; min-height: 100vh; padding: 24px 16px; }
  h1 { color: #f5a623; font-size: 1.3rem; margin-bottom: 4px; }
  p.sub { color: #888; font-size: 0.82rem; margin-bottom: 20px; }
  .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  textarea { width: 100%; background: #111; border: 1px solid #333; border-radius: 8px; color: #e8e8e8; font-size: 0.9rem; padding: 10px; resize: vertical; min-height: 80px; }
  button { width: 100%; background: #f5a623; color: #000; border: none; border-radius: 8px; padding: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .cat-row { background: #111; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; border-left: 3px solid #333; }
  .cat-row:nth-child(1) { border-left-color: #f5a623; }
  .cat-row:nth-child(2) { border-left-color: #7eb8ff; }
  .cat-nome { color: #f5a623; font-weight: 700; font-size: 0.95rem; }
  .cat-id { color: #7eb8ff; font-size: 0.82rem; margin-top: 3px; }
  .cat-path { color: #888; font-size: 0.75rem; margin-top: 3px; }
  .errore { color: #ff7070; font-size: 0.85rem; padding: 10px; background: #1f1010; border-radius: 8px; }
  .loading { color: #888; font-size: 0.85rem; text-align: center; padding: 16px; }
  .num { display:inline-block; background:#333; color:#f5a623; border-radius:4px; font-size:0.7rem; font-weight:700; padding:2px 6px; margin-right:6px; }
</style>
</head>
<body>

<h1>🔍 Test Taxonomy eBay Italia</h1>
<p class="sub">Inserisci titolo prodotto → vedi i primi 5 risultati grezzi di eBay Taxonomy</p>

<div class="card">
  <div style="font-size:0.78rem;color:#888;margin-bottom:6px">TITOLO PRODOTTO</div>
  <textarea id="titolo" placeholder="Es: Proteggi Portiera Auto 10M Guarnizione Profili in Gomma Forma a U Bordi AntiGraffio Nero"></textarea>
  <button id="btnCerca" onclick="cercaCategoria()">🔍 Cerca su eBay Taxonomy</button>
</div>

<div id="risultatoBox"></div>

<script>
const WORKER_URL = 'https://dropcsv.carminefascion1.workers.dev';

async function cercaCategoria() {
  var titolo = document.getElementById('titolo').value.trim();
  if (!titolo) { alert('Inserisci un titolo'); return; }

  var btn = document.getElementById('btnCerca');
  var box = document.getElementById('risultatoBox');

  btn.disabled = true;
  btn.textContent = '⏳ Ricerca in corso...';
  box.innerHTML = '<div class="loading">🔍 Taxonomy sta cercando...</div>';

  try {
    var resp = await fetch(WORKER_URL + '/test-taxonomy?titolo=' + encodeURIComponent(titolo.substring(0, 350)));
    var data = await resp.json();

    if (data.ok && data.risultati && data.risultati.length > 0) {
      var html = '<div class="card"><div style="font-size:0.78rem;color:#888;margin-bottom:10px">RISULTATI TAXONOMY (' + data.risultati.length + ' trovati)</div>';
      data.risultati.forEach(function(r, i) {
        html += '<div class="cat-row">' +
          '<div class="cat-nome"><span class="num">' + (i+1) + '</span>' + escHtml(r.nome) + '</div>' +
          '<div class="cat-id">🔢 ID: <strong>' + escHtml(r.id) + '</strong></div>' +
          '<div class="cat-path">📂 ' + escHtml(r.path) + '</div>' +
          '</div>';
      });
      html += '<div style="font-size:0.75rem;color:#555;margin-top:8px">Query: "' + escHtml(titolo.substring(0, 80)) + '"</div></div>';
      box.innerHTML = html;
    } else {
      box.innerHTML = '<div class="card"><div class="errore">❌ Nessun risultato.<br><span style="color:#888">' + escHtml(JSON.stringify(data)) + '</span></div></div>';
    }
  } catch(e) {
    box.innerHTML = '<div class="card"><div class="errore">❌ Errore: ' + escHtml(e.message) + '</div></div>';
  }

  btn.disabled = false;
  btn.textContent = '🔍 Cerca su eBay Taxonomy';
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('titolo').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); cercaCategoria(); }
});
</script>
</body>
</html>
