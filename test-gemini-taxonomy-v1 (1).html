<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Gemini + Taxonomy</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f0f; color: #e8e8e8; font-family: 'Segoe UI', sans-serif; min-height: 100vh; padding: 24px 16px; }
  h1 { color: #f5a623; font-size: 1.3rem; margin-bottom: 4px; }
  p.sub { color: #888; font-size: 0.82rem; margin-bottom: 20px; }
  .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  textarea { width: 100%; background: #111; border: 1px solid #333; border-radius: 8px; color: #e8e8e8; font-size: 0.9rem; padding: 10px; resize: vertical; min-height: 100px; }
  button { width: 100%; background: #f5a623; color: #000; border: none; border-radius: 8px; padding: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .label { font-size: 0.75rem; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .valore { font-size: 0.95rem; font-weight: 600; margin-bottom: 12px; }
  .query-en { color: #7eb8ff; font-size: 1.1rem; font-weight: 700; }
  .cat-it { color: #f5a623; }
  .cat-row { background: #111; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; border-left: 3px solid #333; }
  .cat-row:nth-child(1) { border-left-color: #f5a623; }
  .cat-row:nth-child(2) { border-left-color: #7eb8ff; }
  .cat-nome { font-weight: 700; font-size: 0.9rem; }
  .cat-id { color: #7eb8ff; font-size: 0.8rem; margin-top: 3px; }
  .cat-path { color: #666; font-size: 0.73rem; margin-top: 3px; }
  .num { display:inline-block; background:#2a2a2a; color:#f5a623; border-radius:4px; font-size:0.7rem; font-weight:700; padding:2px 6px; margin-right:6px; }
  .errore { color: #ff7070; font-size: 0.85rem; padding: 10px; background: #1f1010; border-radius: 8px; }
  .loading { color: #888; font-size: 0.85rem; text-align: center; padding: 20px; }
  .step { display:flex; align-items:center; gap:8px; font-size:0.8rem; color:#888; margin-bottom:8px; }
  .step-done { color:#4caf50; }
  .step-active { color:#f5a623; }
  .divider { border: none; border-top: 1px solid #2a2a2a; margin: 12px 0; }
</style>
</head>
<body>

<h1>🤖 Test Gemini + Taxonomy eBay</h1>
<p class="sub">Inserisci titolo Amazon → Gemini crea query inglese → Taxonomy trova categoria e ID</p>

<div class="card">
  <div class="label">Titolo prodotto Amazon</div>
  <textarea id="titolo" placeholder="Es: Ventola di Raffreddamento CPU per NUC8, 4 Pin, Basso Rumore..."></textarea>
  <button id="btnCerca" onclick="cerca()">🤖 Gemini + Taxonomy</button>
</div>

<div id="stepsBox" style="display:none" class="card">
  <div class="step" id="step1">⏳ Gemini analizza il titolo...</div>
  <div class="step" id="step2" style="color:#555">⏳ Taxonomy cerca categoria...</div>
</div>

<div id="risultatoBox"></div>

<script>
const WORKER_URL = 'https://dropcsv.carminefascion1.workers.dev';

async function cerca() {
  var titolo = document.getElementById('titolo').value.trim();
  if (!titolo) { alert('Inserisci un titolo'); return; }

  var btn = document.getElementById('btnCerca');
  var stepsBox = document.getElementById('stepsBox');
  var risultatoBox = document.getElementById('risultatoBox');
  var step1 = document.getElementById('step1');
  var step2 = document.getElementById('step2');

  btn.disabled = true;
  btn.textContent = '⏳ In corso...';
  stepsBox.style.display = 'block';
  risultatoBox.innerHTML = '';
  step1.className = 'step step-active';
  step1.textContent = '🤖 Gemini analizza il titolo...';
  step2.className = 'step';
  step2.style.color = '#555';
  step2.textContent = '⏳ Taxonomy cerca categoria...';

  try {
    var resp = await fetch(WORKER_URL + '/test-gemini-taxonomy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ titolo: titolo })
    });

    step1.className = 'step step-done';
    step1.textContent = '✅ Gemini ha trovato la query';
    step2.className = 'step step-active';
    step2.textContent = '🔍 Taxonomy sta cercando...';

    var data = await resp.json();

    step2.className = 'step step-done';
    step2.textContent = '✅ Taxonomy ha risposto';

    if (!data.ok) {
      risultatoBox.innerHTML = '<div class="card"><div class="errore">❌ Errore: ' + escHtml(data.error || 'sconosciuto') + '</div></div>';
      return;
    }

    var html = '<div class="card">';

    // Query Gemini
    html += '<div class="label">Query inglese creata da Gemini</div>';
    html += '<div class="valore query-en">🔍 "' + escHtml(data.gemini_query_en) + '"</div>';

    html += '<div class="label">Categoria italiana attesa da Gemini</div>';
    html += '<div class="valore cat-it">📂 ' + escHtml(data.gemini_categoria_it || '—') + '</div>';

    html += '<hr class="divider">';

    // Risultati Taxonomy
    html += '<div class="label">Risultati Taxonomy (' + (data.risultati ? data.risultati.length : 0) + ' trovati)</div>';

    if (data.risultati && data.risultati.length > 0) {
      data.risultati.forEach(function(r, i) {
        html += '<div class="cat-row">' +
          '<div class="cat-nome"><span class="num">' + (i+1) + '</span>' + escHtml(r.nome) + '</div>' +
          '<div class="cat-id">🔢 ID: <strong>' + escHtml(r.id) + '</strong></div>' +
          '<div class="cat-path">📂 ' + escHtml(r.path) + '</div>' +
          '</div>';
      });
    } else {
      html += '<div style="color:#888;font-size:0.85rem">Nessun risultato trovato</div>';
    }

    html += '</div>';
    risultatoBox.innerHTML = html;

  } catch(e) {
    risultatoBox.innerHTML = '<div class="card"><div class="errore">❌ Errore connessione: ' + escHtml(e.message) + '</div></div>';
  }

  btn.disabled = false;
  btn.textContent = '🤖 Gemini + Taxonomy';
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('titolo').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); cerca(); }
});
</script>
</body>
</html>
